
<section class="skills-section">
  <h2 class="section-title">Key Skills</h2>

  <ul class="work-list">
    @for (skill of skills(); track skill) {
      <li class="work-item">
        <button
          type="button"
          class="skill"
          (click)="selectSkill(skill)">
          {{ skill }}
        </button>
      </li>
    }
  </ul>
</section>
